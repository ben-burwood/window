[workspace]
resolver = "2"
members = [
  "crates/window-core",
  "crates/window-tauri",
  "apps/data-framer/src-tauri",
  "apps/map-windower/src-tauri",
  "apps/doc-viewer/src-tauri",
  "apps/image-shutter",
  "apps/drawing-paner",
  "apps/model-glazer",
  "apps/ssh-sill",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.99"
license = "MIT"
authors = ["Ben Burwood"]
repository = "https://github.com/ben-burwood/window"
readme = "README.md"
publish = false

# Shared dependency versions. Apps opt in with e.g. `serde = { workspace = true }`, and may add extra features on top (e.g. tauri's `protocol-asset`).
# App-specific deps (polars, arrow/parquet, resvg, ...) stay in their app's Cargo.toml.
[workspace.dependencies]
# Internal
window-core = { path = "crates/window-core" }
window-tauri = { path = "crates/window-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# egui apps
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
egui_glow = "0.37"
rfd = "0.17"
# Formats
geozero = { version = "0.15.1", default-features = false, features = ["with-wkb", "with-geojson"] }

[workspace.lints.clippy]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
