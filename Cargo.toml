# Workspace root for the viewers monorepo.
# Four independently-built binaries share one lockfile, one target/, and one toolchain.
# Members are added in Phase 2 as each app is copied in.
[workspace]
resolver = "2"
members = ["crates/viewer-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Ben Burwood"]

# Shared dependency versions. Apps opt in with e.g. `serde = { workspace = true }`.
# Format-specific deps (polars, arrow/parquet, resvg, ...) stay in their app's Cargo.toml.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lints are defined here; each crate opts in with `[lints] workspace = true`.
# CI runs `cargo clippy --workspace -- -D warnings`.
[workspace.lints.clippy]

# Release profile lives only in the workspace root (per-crate profiles are ignored in a
# workspace). `panic = "abort"` is evaluated in Phase 2 once real crates exist, since it
# would apply to the Tauri apps as well as image-shutter.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
