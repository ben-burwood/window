[package]
name = "image-shutter"
description = "A tiny, fast, native SVG viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
window-core = { workspace = true }
window-egui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
usvg = "0.48"
resvg = "0.48"
tiny-skia = "0.12"
rfd = { workspace = true }
flate2 = "1"

# ---------------------------------------------------------------------------
# cargo-packager configuration (https://github.com/crabnebula-dev/cargo-packager)
# Produces .dmg/.app (macOS), NSIS .exe (Windows), .deb/.AppImage (Linux),
# registers the SVG file association on every platform, and generates the
# platform icons from icons/icon.png.
# ---------------------------------------------------------------------------
[package.metadata.packager]
product-name = "Image Shutter"
identifier = "com.image-shutter.app"
before-packaging-command = "cargo build --release"
icons = ["icons/icon.png"]
out-dir = "dist"
category = "Utility"
publisher = "Ben Burwood"
homepage = "https://github.com/ben-burwood/window"

[[package.metadata.packager.file-associations]]
extensions = ["svg", "svgz"]
mime-type = "image/svg+xml"
description = "Scalable Vector Graphics"
name = "SVG Image"
role = "viewer"

