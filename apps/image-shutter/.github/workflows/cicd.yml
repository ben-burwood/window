name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            formats: 'dmg'
          - platform: 'ubuntu-latest'
            formats: 'deb appimage'
          - platform: 'windows-latest'
            formats: 'nsis'

    runs-on: ${{ matrix.platform }}
    env:
      # Let AppImage tooling run without a FUSE mount on CI runners.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Publish to draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: app-v${{ steps.version.outputs.version }}
          name: Image Shutter v${{ steps.version.outputs.version }}
          body: 'See the assets below to download and install this version.'
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
