[package]
name = "config-lintel"
description = "YAML / TOML / JSON / XML config viewer and editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
window-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# syntect highlighting; two-face adds the syntaxes syntect's defaults lack (TOML). Both use the
# pure-Rust regex engine ("fancy") like egui_extras, so there's no C dependency.
egui_extras = { workspace = true, features = ["syntect"] }
syntect = { version = "5.3", default-features = false, features = ["default-themes", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
rfd = { workspace = true }
serde = { workspace = true }
# preserve_order keeps tables / objects in document order in the tree.
serde_json = { workspace = true, features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
roxmltree = "0.21"

# ---------------------------------------------------------------------------
# cargo-packager configuration (https://github.com/crabnebula-dev/cargo-packager)
# Produces .dmg/.app (macOS), NSIS .exe (Windows), .deb/.AppImage (Linux),
# registers the YAML / TOML / JSON / XML file associations on every platform, and
# generates the platform icons from icons/icon.png.
# ---------------------------------------------------------------------------
[package.metadata.packager]
product-name = "Config Lintel"
identifier = "com.config-lintel.app"
before-packaging-command = "cargo build --release"
icons = ["icons/icon.png"]
out-dir = "dist"
category = "DeveloperTool"
publisher = "Ben Burwood"
homepage = "https://github.com/ben-burwood/window"

[[package.metadata.packager.file-associations]]
extensions = ["yaml", "yml"]
mime-type = "application/yaml"
description = "YAML Document"
name = "YAML Document"
role = "editor"

[[package.metadata.packager.file-associations]]
extensions = ["toml"]
mime-type = "application/toml"
description = "TOML Document"
name = "TOML Document"
role = "editor"

[[package.metadata.packager.file-associations]]
extensions = ["json"]
mime-type = "application/json"
description = "JSON Document"
name = "JSON Document"
role = "editor"

[[package.metadata.packager.file-associations]]
extensions = ["xml"]
mime-type = "application/xml"
description = "XML Document"
name = "XML Document"
role = "editor"
