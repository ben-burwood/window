[package]
name = "data-framer"
version.workspace = true
description = "DataFrame Viewer"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "data_framer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
viewer-core = { workspace = true }
viewer-tauri = { workspace = true }
tauri = { workspace = true }
# Plugins are initialized in viewer-tauri, but must be *direct* deps here so Tauri's ACL
# discovers their permissions (opener:default / dialog:default) referenced in capabilities/.
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
geozero = { workspace = true }
# Format-specific — stays in the app.
polars = { version = "0.53", features = [
  "lazy",
  "parquet",
  "csv",
  "dtype-full",
  "dtype-extension",
  "strings",
  "regex",
] }
chrono = "0.4"
