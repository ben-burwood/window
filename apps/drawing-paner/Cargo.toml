[package]
name = "drawing-paner"
version.workspace = true
edition.workspace = true
description = "A tiny, fast, native DXF viewer"
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/ben-burwood/window"
readme = "README.md"

[lints]
workspace = true

[dependencies]
window-core = { workspace = true }
eframe = "0.35"
egui = "0.35"
rfd = "0.15"
dxf = "0.6"

# ---------------------------------------------------------------------------
# cargo-packager configuration (https://github.com/crabnebula-dev/cargo-packager)
# Produces .dmg/.app (macOS), NSIS .exe (Windows), .deb/.AppImage (Linux),
# registers the DXF file association on every platform, and generates the
# platform icons from icons/icon.png.
# ---------------------------------------------------------------------------
[package.metadata.packager]
product-name = "Drawing Paner"
identifier = "com.drawing-paner.app"
before-packaging-command = "cargo build --release"
icons = ["icons/icon.png"]
out-dir = "dist"
category = "Utility"
authors = ["Ben Burwood"]
publisher = "Ben Burwood"
license-file = "../../LICENSE"
homepage = "https://github.com/ben-burwood/window"

[[package.metadata.packager.file-associations]]
extensions = ["dxf"]
mime-type = "image/vnd.dxf"
description = "AutoCAD DXF Drawing"
name = "DXF Drawing"
role = "viewer"

