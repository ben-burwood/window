name: WinGet New (first submission)

# One-time "new" submission for packages that are not yet in winget-pkgs.
# `wingetcreate update` (winget.yml) only works once a package already exists, so brand-new
# packages must be bootstrapped here first. After the first version merges into winget-pkgs,
# winget.yml keeps them updated automatically on every release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.3 (no leading v)"
        required: true
      apps:
        description: "Space/comma-separated app names to submit"
        required: false
        default: "doc-viewer map-windower image-shutter drawing-paner model-glazer"
      dry_run:
        description: "Generate + validate only, do not open PRs"
        type: boolean
        default: false

jobs:
  winget-new:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Submit new packages to WinGet
        shell: pwsh
        run: |
          $apps = "${{ inputs.apps }}" -split '[ ,]+' | Where-Object { $_ }
          $params = @{ Version = "${{ inputs.version }}"; Apps = $apps; Token = $env:WINGET_TOKEN }
          if ("${{ inputs.dry_run }}" -eq "true") { $params.DryRun = $true }
          ./scripts/winget-new.ps1 @params
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
