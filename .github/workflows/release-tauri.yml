name: Release (Tauri apps)

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        app: [data-framer, map-windower, doc-viewer]
        platform: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: System deps (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v7

      - run: rustup show
      - name: Add macOS universal target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed on the single root Cargo.lock via rust-cache's default lockfile hashing.
          shared-key: release
          workspaces: ". -> target"

      - run: npm ci

      - name: Build & publish ${{ matrix.app }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          projectPath: apps/${{ matrix.app }}
          args: ${{ matrix.args }} --config ${{ github.workspace }}/tauri.base.json
