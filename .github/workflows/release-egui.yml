name: Release (egui app)

on:
  push:
    tags: ["v*"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-egui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            formats: dmg
          - platform: ubuntu-latest
            formats: deb appimage
          - platform: windows-latest
            formats: nsis
    runs-on: ${{ matrix.platform }}
    env:
      # Let AppImage tooling run without a FUSE mount on CI runners.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7

      - name: System deps (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: ". -> target"

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build & package
        working-directory: apps/image-shutter
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Publish to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Window ${{ github.ref_name }}"
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            apps/image-shutter/dist/*.dmg
            apps/image-shutter/dist/*.deb
            apps/image-shutter/dist/*.AppImage
            apps/image-shutter/dist/*.exe
            apps/image-shutter/dist/*.msi
