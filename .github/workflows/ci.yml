name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.set.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate path filters
        run: |
          {
            echo "shared:"
            for p in Cargo.toml Cargo.lock rust-toolchain.toml ".cargo/**" "crates/**" "packages/**" \
                     package.json package-lock.json .nvmrc tauri.base.json ".github/workflows/**"; do
              echo "  - '$p'"
            done
            for d in apps/*/; do
              app=$(basename "$d")
              echo "$app:"
              echo "  - 'apps/$app/**'"
            done
          } > "$RUNNER_TEMP/filters.yml"
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: ${{ runner.temp }}/filters.yml
      - id: set
        env:
          CHANGES: ${{ steps.f.outputs.changes }}
        run: |
          rust='[]'
          add() { rust=$(jq -c ". += [$1]" <<<"$rust"); }
          changed() { [[ "$CHANGES" == *"\"$1\""* ]]; }
          # crate = cargo package name; deps = system libs to install; web = frontend to build
          for d in apps/*/; do
            app=$(basename "$d")
            changed shared || changed "$app" || continue
            if [ -d "apps/$app/src-tauri" ]; then
              add "{\"crate\":\"$app\",\"deps\":\"webkit\",\"web\":\"$app\"}"
            else
              add "{\"crate\":\"$app\",\"deps\":\"egui\",\"web\":\"\"}"
            fi
          done
          if changed shared; then
            add '{"crate":"window-core","deps":"none","web":""}'
            add '{"crate":"window-tauri","deps":"webkit","web":""}'
          fi
          echo "rust={\"include\":$rust}" >> "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show # installs the toolchain pinned by rust-toolchain.toml
      - run: cargo fmt --all --check

  fmt-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false # deps already installed by npm ci
          node-manager: false # keep the Node from setup-node
      - run: vp fmt --check

  rust:
    needs: changes
    if: needs.changes.outputs.rust != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.rust) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: System deps (Tauri / webkit)
        if: matrix.deps == 'webkit'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: System deps (egui)
        if: matrix.deps == 'egui'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      # Tauri app crates embed the built frontend at compile time (generate_context! reads
      # ../dist), so build the frontend first. `npm run build` also runs vue-tsc (typecheck).
      - uses: actions/setup-node@v7
        if: matrix.web != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: matrix.web != ''
        run: npm ci
      - if: matrix.web != ''
        run: npm run build --workspace ${{ matrix.web }}

      - run: rustup show # installs the pinned toolchain + clippy/rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache shared across app jobs, keyed on the single root Cargo.lock.
          shared-key: workspace
      - name: clippy
        run: cargo clippy -p ${{ matrix.crate }} --all-targets -- -D warnings
      - name: test
        run: cargo test -p ${{ matrix.crate }}
